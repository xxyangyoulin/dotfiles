# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ============================================================
# 01. 环境变量与基础设置 (ENV & BASE)
# ============================================================
env = QT_IM_MODULE fcitx
env = XMODIFIERS "@im=fcitx"
env = MYPHONE,ed546061
env = LANG,zh_CN.UTF-8
env = LANGUAGE,zh_CN:zh:en_US:en
env = LC_ALL,zh_CN.UTF-8

# env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
# env = QT_SCALE_FACTOR, 1.6
# env = GDK_DPI_SCALE, 1.6

xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = false
}

# ============================================================
# 02. 显示器配置 (MONITOR CONFIG)
# ============================================================
# Monitors from existing configuration
# monitor=HDMI-A-1,preferred,auto,auto
# monitor=Unknown-1,1920x1080@60,0x0,1
# monitor=Unknown-1,1920x1080@60,0x0,1
# monitor=,preferred,auto,auto
# monitor=ss,1920x1080@60,0x0,1
# monitor=HEADLESS-2,1920x1080@60,0x0,1
# monitor=DP-2,preferred,auto,1.875

monitor = , preferred,auto,1
#monitor=,3840x2160@60,auto,1.

#  monitor = , preferred,auto,auto

# ============================================================
# 03. 输入与外设 (INPUT & CURSOR)
# ============================================================
input {
    kb_layout = us
    numlock_by_default = true

    follow_mouse = 2
    float_switch_override_focus=0
}

cursor {
    no_warps = true
    min_refresh_rate=50
    # 其它 cursor 相关设置，比如：
    # warp_on_change_workspace = 0
    # persistent_warps = false
    # enable_hyprcursor = true
    
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# ============================================================
# 04. 视觉表现 (GENERAL & DECORATION)
# ============================================================
general {
    gaps_in = 3
    gaps_out = 3
    border_size = 2  # off in niri

    # col.active_border = rgba(707070ff)
    # col.inactive_border = rgba(d0d0d0ff)
    col.active_border = rgb(d1d0d0)
    col.inactive_border = rgb(586274)
    resize_on_border = false
    allow_tearing = false

    # layout = dwindle
    layout = master
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true

        # 阴影范围：mac 偏大且很软
        range = 45

        # 渲染强度：数值越大越“糊”，mac 是糊而不脏
        render_power = 4

        # 轻微向下偏移（mac 的关键点）
        offset = 0 5

        # 低对比度黑色，偏透明
        color = rgba(00000028)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.1696
        new_optimizations = true
    }
}

group {
    groupbar {
        indicator_height = 0
        font_size = 12
        font_weight_active = bold
        blur = true
        gradients=true
        font_family=SourceHanSerifCN
        col.active=rgba(00000000)
        col.inactive=rgba(22000000)
        keep_upper_gap=false
    }
}

# ============================================================
# 05. 动画效果 (ANIMATIONS)
# ============================================================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    #animation = workspaces, 0, 1.5, default
    #animation = workspaces, 1, 3, default,slide 10%
    animation = workspacesIn, 1, 3, default,slide 10%
    animation = workspacesOut, 1, 3, default,slidefade 10%
    #animation = workspaces, 1, 3, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ============================================================
# 06. 布局策略 (LAYOUTS)
# ============================================================
dwindle {
    preserve_split = true
    force_split = 2
}

master {
    orientation = left   # 主窗口在左边
    mfact = 0.65
}

# ============================================================
# 07. 杂项与插件 (MISC & PLUGINS)
# ============================================================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    allow_session_lock_restore = 1
    focus_on_activate = true
    mouse_move_enables_dpms = false
}

plugin:dynamic-cursors {
    # enables the plugin
    enabled = true
    mode = tilt
}

plugin:easymotion{
	textsize=25
	rounding=6
	textpadding=16
	bgcolor=rgba(33ccffee)
}

plugin:hyprexpo {
       columns = 3
       gap_size = 5
       bg_col = rgb(111111)
       workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1

#       gesture_distance = 300 # how far is the "max" for the gesture
}

# ============================================================
# 08. 启动应用 (STARTUP APPS)
# ============================================================
exec-once = systemctl --user import-environment --all
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprland-session.target
exec-once = xrdb -merge ~/.Xresources
exec-once = fcitx5 -d  --replace
exec-once = flclash
exec-once = udiskie &
exec-once = bash -c "wl-paste --watch cliphist store &"
#exec-once = wl-paste --type text --watch cliphist store
#exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clipboard-history -t
#exec-once = wl-paste --watch cliphist store
exec-once = kdeconnectd
exec-once = kdeconnect-indicator
exec-once = rustdesk
exec-once = ~/sh/wechat_focus_main.sh
exec-once = vicinae server
exec-once = pot

# ============================================================
# 09. 窗口/层级规则 (RULES)
# ============================================================
# --- 通用窗口规则 ---
windowrule{
    name = tile_window
    match:class = ^(org\.wezfurlong\.wezterm|gnome-control-center|pavucontrol|nm-connection-editor)$
}

windowrule{
    name = border-1
    match:class = ^(kitty|wechat)$
}

windowrule = match:class ^(org\.gnome\.), rounding 12
windowrule = match:class ^(org\.gnome\.), border_size 0

windowrule = match:class ^(gnome-calculator)$, float on
windowrule = match:class ^(galculator)$, float on
windowrule = match:class ^(org.gnome.Evolution)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(org\.gnome\.Nautilus)$, float on
windowrule = match:class ^(org\.telegram\.desktop)$, float on
windowrule = match:class ^(steam)$, float on
windowrule = match:class ^(xdg-desktop-portal)$, float on
windowrule = match:class ^(com.follow.clash)$, float on

windowrule = match:class ^(org\.wezfurlong\.wezterm)$, border_size 0
windowrule = match:class ^(Alacritty)$, border_size 0
windowrule = match:class ^(zen)$, border_size 0
windowrule = match:class ^(com\.mitchellh\.ghostty)$, border_size 0

windowrule = match:class ^(firefox)$, match:title ^(Picture-in-Picture)$, float on
windowrule = match:class ^(zoom)$, float on

windowrule = match:class ^(fcitx.*)$, float on, border_size 0, no_blur on, no_focus on

windowrule = match:class ^(scrcpy.*)$, float on
windowrule = match:class ^(mpv.*)$, float on
windowrule = match:class ^(io.github.kaii_lb.Overskride.*)$, float on
windowrule = match:class ^(org.pulseaudio.pavucontrol.*)$, float on
windowrule = match:class ^(nm-connection-editor.*)$, float on
windowrule = match:class ^(qBittorrent.*)$, float on
windowrule = match:class ^(QQ.*)$, float on
windowrule = match:class ^(rustdesk.*)$, float on

windowrule = match:class ^(satty.*)$, pin on

windowrule = match:class ^(crow-translate.*)$, float on
windowrule = match:class ^(netease-cloud-music.*)$, float on
windowrule = match:class ^(Pot.*)$, float on
windowrule = match:class ^(flclash.*)$, float on

windowrule = match:class ^(Waydroid.*|waydroid.*)$, float on, border_size 0, no_blur on

windowrule = match:class ^(xdg-desktop-portal-gtk.*)$, float on

windowrule = match:class ^(copyq)$, float on
windowrule = match:class ^(org.kde.kruler)$, float on

windowrule = match:class ^(pot)$, float on
windowrule = match:class ^(pot)$, match:title (Translator|OCR|PopClip|Screenshot Translate), float on
windowrule = match:class ^(pot)$, opacity 0.95 0.95

windowrule = match:class ^(pot)$, match:title (Translator|PopClip|Screenshot Translate), move cursor 0 0
windowrule = match:class ^(pot)$, size 520 1000

windowrule = match:class ^(copyq)$, size 320 500
windowrule = match:class ^(copyq)$, move onscreen cursor

windowrule = match:class ^(swappy)$, pin on, no_blur true
windowrule = match:class ^(com.xunlei.download)$, no_blur true

windowrule = match:class ^(org\.gnome\.Nautilus)$, size 1200 800

# --- 工作区绑定与特殊规则 ---
windowrule = match:class ^(apifox)$, workspace 3 silent
# windowrule = match:class ^(google-chrome)$, workspace 2 silent
windowrule = match:class ^(即时设计)$, workspace 5 silent
# windowrule = match:class ^(jetbrains-datagrip)$, workspace 4 silent
# windowrule = match:class ^(android-studio)$, workspace 6 silent
# windowrule = match:class ^(jetbrains-phpstorm)$, workspace 1 silent
windowrule = match:class ^(scrcpy)$, workspace 10 silent
windowrule = match:class ^(scrcpy)$, size 300 653
windowrule = match:class ^(scrcpy)$, move 731 224

windowrule = match:class ^(kitty)$, opacity 0.9 0.9
windowrule = match:class ^(wechat)$, opacity 0.97 0.97
windowrule = match:class ^(wechat)$, border_color rgb(07C160) rgb(A3D9D1)

windowrule = match:class ^(jetbrains-).*, match:float on, no_initial_focus on

windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, match:title ^$, match:class ^$, no_focus on

workspace = w[t1], gapsout:0, gapsin:0
windowrule = match:workspace w[t1], match:float 0, border_size 0

# DMS windows floating by default
windowrule = match:class ^(org.quickshell)$, float on
#windowrule = match:float 0, match:focus 0, opacity 0.9 0.9

# --- 微信特定规则 ---
# windowrule{
#     name = wechat
#     no_blur = true
#     border_size = 0
#     no_shadow = true
#     match:class = (wechat)
#     match:title = negative:^(微信|设置|聊天文件|预览|图片和视频)\W*
# }
windowrule {
    name=fix-wechat
    match:class = wechat
    match:title = negative:^(朋友圈|微信|设置|聊天文件|预览|图片和视频)\W*
    no_blur=on
    no_shadow=on
    border_size=0
}

windowrule {
    name=fix-wechat-send
    match:class = wechat
    match:title = ^微信发送给$
    no_blur=on
    no_shadow=on
    border_size=0
}
windowrule = match:class ^(wechat)$, match:title .*,float true
# windowrule = match:class ^(wechat)$, match:title .*.的聊天记录.*|打开|朋友圈, no_shadow false
# windowrule = match:xwayland 1, match:title 微信, float true

windowrule = float on, match:title (Picture-in-Picture|画中画)
windowrule = pin on, match:title (Picture-in-Picture|画中画)
windowrule = size 640 360, match:title (Picture-in-Picture|画中画)
windowrule = move 100%-660 100%-390, match:title (Picture-in-Picture|画中画)

# `windowrule = noblur, class:^wechat$, title:^微信发送给$
# `windowrule = noborder, class:^wechat$, title:^微信发送给$
# `windowrule = noshadow, class:^wechat$, title:^微信发送给$

