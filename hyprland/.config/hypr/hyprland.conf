 bind = $mainMod SHIFT, T, movetoworkspace, +0

bind = $mainMod, Y, togglegroup, # 切换编组（打开编组模式后，同组的窗口会叠在一起）
bind = $mainMod, Z, changegroupactive # 切换编组中的窗口
bind = $mainMod, U, changegroupactive # 切换编组中的窗口
bind = $mainMod SHIFT, U, moveoutofgroup # 切换编组中的窗口
bind = $mainMod, d, pseudo, # dwindle # 伪平铺，后面解释
bind = $mainMod ALT, G, lockgroups,toggle

# bind = $mainMod, x,  exec,swaylock --color 000000 
bind = $mainMod, x, exec,/home/yyl/sh/killscrcpy.sh; hyprlock

bind = $mainMod, F8, exec, /home/yyl/sh/startscrcpy.sh
bind = $mainMod, F10, exec, /home/yyl/sh/unlockphone.sh
bind = $mainMod, F9, exec, /home/yyl/sh/killscrcpy.sh
bind = $mainMod, F1, exec, adb -s ed546061 shell input keyevent KEYCODE_HOME
# bind = $mainMod, G, exec, /home/yyl/sh/openwechat.sh
bind = $mainMod, G, exec, hdrop wechat
bind = $mainMod shift, G, exec, hdrop netease-cloud-music

binds {
allow_workspace_cycles = true
}
bind = SUPER, Tab, workspace, previous


bind = $mainMod SHIFT,p, exit

# 截图
bind = $mainMod shift, F, exec, grim -t png -g "$(slurp)" - | swappy -f - # take a screenshot
bind = $mainMod ctrl, G, exec, hyprpicker |wl-copy

# 屏幕亮度
bind = $mainMod, F11, exec, /home/yyl/sh/dd-incbr.sh
bind = $mainMod, F12, exec, /home/yyl/sh/dd-decbr.sh

bind = $mainMod shift, F11, exec, pkill gammastep
bind = $mainMod shift, F12, exec, gammastep -O 5000

# Win(Ctrl+Super) + Ctrl + Esc 重启 Waybar
bind = SUPER CTRL, ESCAPE, exec, pkill -SIGUSR2 waybar || waybar &

# bind = $mainMod, V, exec, copyq -e "toggle()"

# kill
bind = $mainMod alt, 9, exec, hyprctl kill

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

