# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# Monitors from existing configuration
# monitor=HDMI-A-1,preferred,auto,auto
# monitor=Unknown-1,1920x1080@60,0x0,1
# monitor=Unknown-1,1920x1080@60,0x0,1
# monitor=,preferred,auto,auto
# monitor=ss,1920x1080@60,0x0,1
# monitor=HEADLESS-2,1920x1080@60,0x0,1
# monitor=DP-2,preferred,auto,1.875

monitor = , preferred,auto,1
#monitor=,3840x2160@60,auto,1.

#  monitor = , preferred,auto,auto

# ==================
# STARTUP APPS
# ==================
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprland-session.target
exec-once = xrdb -merge ~/.Xresources
exec-once = fcitx5 -d  --replace
exec-once = flclash
exec-once = udiskie &
exec-once = bash -c "wl-paste --watch cliphist store &"
#exec-once = wl-paste --type text --watch cliphist store
#exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clipboard-history -t
#exec-once = wl-paste --watch cliphist store
exec-once = kdeconnectd
exec-once = kdeconnect-indicator
exec-once = rustdesk

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = us
    numlock_by_default = true

    follow_mouse = 2
    float_switch_override_focus=0
}
cursor {
    no_warps = true
    # 其它 cursor 相关设置，比如：
    # warp_on_change_workspace = 0
    # persistent_warps = false
    # enable_hyprcursor = true
}
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 3
    gaps_out = 3
    border_size = 2  # off in niri

    # col.active_border = rgba(707070ff)
    # col.inactive_border = rgba(d0d0d0ff)
    col.active_border = rgb(d1d0d0)
    col.inactive_border = rgb(586274)
    resize_on_border = false
    allow_tearing = false

    # layout = dwindle
    layout = master
}


# ==================
# DECORATION
# ==================
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.1696
        new_optimizations = true
        #xray = true
    }
}

group {
    groupbar {
        indicator_height = 0
        font_weight_active = bold
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    #animation = workspaces, 0, 1.5, default
    #animation = workspaces, 1, 3, default,slide 10%
    animation = workspacesIn, 1, 3, default,slide 10%
    animation = workspacesOut, 1, 3, default,slidefade 10%
    #animation = workspaces, 1, 3, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
    force_split = 2
}
master {
    orientation = left   # 主窗口在左边
    mfact = 0.65
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    allow_session_lock_restore = 1
    focus_on_activate = false
    mouse_move_enables_dpms = false

}

# ==================
# WINDOW RULES
# ==================
windowrulev2 = tile, class:^(org\.wezfurlong\.wezterm)$
windowrulev2 = bordersize 2,class:^(kitty)$
windowrulev2 = bordersize 2,class:^(wechat)$

windowrulev2 = rounding 12, class:^(org\.gnome\.)
windowrulev2 = noborder, class:^(org\.gnome\.)

windowrulev2 = tile, class:^(gnome-control-center)$
windowrulev2 = tile, class:^(pavucontrol)$
windowrulev2 = tile, class:^(nm-connection-editor)$

windowrulev2 = float, class:^(gnome-calculator)$
windowrulev2 = float, class:^(galculator)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org\.gnome\.Nautilus)$
windowrulev2 = float, class:^(org\.telegram\.desktop)$
windowrulev2 = float, class:^(steam)$
windowrulev2 = float, class:^(xdg-desktop-portal)$

windowrulev2 = noborder, class:^(org\.wezfurlong\.wezterm)$
windowrulev2 = noborder, class:^(Alacritty)$
windowrulev2 = noborder, class:^(zen)$
windowrulev2 = noborder, class:^(com\.mitchellh\.ghostty)$

windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(zoom)$
 windowrulev2 = noborder, class:^(fcitx.*)$
 windowrulev2 = noblur, class:^(fcitx.*)$
# windowrulev2 = noshadow, class:^(fcitx.*)$
windowrulev2 = nofocus, class:^(fcitx.*)$
windowrulev2 = float, class:^(fcitx.*)$
windowrulev2 = float, class:^(scrcpy.*)$
windowrulev2 = float, class:^(mpv.*)$
windowrulev2 = float, class:^(io.github.kaii_lb.Overskride.*)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol.*)$
windowrulev2 = float, class:^(nm-connection-editor.*)$
windowrulev2 = float, class:^(qBittorrent.*)$
windowrulev2 = float, class:^(QQ.*)$
windowrulev2 = float,  class:^微信.*
windowrulev2 = float,  class:^rustdesk.*
windowrulev2 = pin,  class:^satty.*
windowrulev2 = float,  class:^crow-translate.*
windowrulev2 = float,  class:^netease-cloud-music.*
windowrulev2 = float,  class:^Pot.*
windowrulev2 = float,  class:^flclash.*
windowrulev2 = float, class:^(wechat)$, title:.*
windowrulev2 = float,  class:^waydroid.*
windowrulev2 = float,  class:^Waydroid.*
windowrulev2 = noblur,  class:^Waydroid.*
windowrulev2 = noborder,  class:^Waydroid.*
# windowrulev2 = size 576 1024,class:^Waydroid.*
windowrulev2 = float,  class:^xdg-desktop-portal-gtk.*

windowrulev2 = float,class:(copyq)
windowrulev2 = float,class:(pot)
windowrulev2 = float, class:(pot), title:(Translator|OCR|PopClip|Screenshot Translate) # Translation window floating
windowrulev2 = opacity 0.95,class:^(pot)$

windowrulev2 = move cursor 0 0, class:(pot), title:(Translator|PopClip|Screenshot Translate) # Translation window follows the mouse position.
windowrulev2 = size 520 1000,class:(pot)
windowrulev2 = size 320 500,class:(copyq)
windowrulev2 = move onscreen cursor,class:(copyq)
windowrulev2 = pin,class:(swappy)
windowrulev2 = size 1200 800,class:^(org.gnome.Nautilus)$

windowrulev2 = workspace 3 silent,class:(apifox)
#windowrulev2 = workspace 2 silent,class:(google-chrome)
windowrulev2 = workspace 5 silent,class:(即时设计)
#windowrulev2 = workspace 4 silent,class:(jetbrains-datagrip)
#windowrulev2 = workspace 6 silent,class:(android-studio)
#windowrulev2 = workspace 1 silent,class:(jetbrains-phpstorm)
windowrulev2 = workspace 10 silent,class:(scrcpy)

windowrulev2 = opacity 0.9 0.9, class:^(kitty)$
windowrulev2 = opacity 0.97 0.97, class:^(wechat)$
windowrulev2 = bordercolor rgb(07C160) rgb(A3D9D1),class:(wechat)

windowrulev2=noinitialfocus, class:(jetbrains-)(.*), floating:1
# windowrulev2 = tag +jb, class:^jetbrains-.+$,floating:1
# windowrulev2 = stayfocused, tag:jb
# windowrulev2 = noinitialfocus, tag:jb

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
workspace = w[t1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[t1]

# DMS windows floating by default
windowrulev2 = float, class:^(org.quickshell)$
windowrulev2 = opacity 0.9 0.9, floating:0, focus:0

layerrule = noanim, ^(quickshell)$

# ==================
# KEYBINDINGS
# ==================
$mod = SUPER

# === Application Launchers ===e
bind = $mod,O, exec, hyprctl clients  >~/.layers
bind = $mod, return, exec, kitty # 终端
bind = $mod, space, exec, dms ipc call spotlight toggle # 搜索
bind = $mod, V, exec, dms ipc call clipboard toggle # 剪切板
bind = $mod SHIFT, M, exec, dms ipc call processlist focusOrToggle # 系统监视器
# bind = $mod, comma, exec, dms ipc call settings focusOrTogglew 
bind = $mod, N, exec, dms ipc call notifications toggle # 通知
bind = $mod SHIFT, N, exec, dms ipc call notepad toggle # 便签
# bind = $mod, Y, exec, dms ipc call dankdash wallpaper
# bind = $mod, TAB, exec, dms ipc call hypr toggleOverview
bind = $mod, E, exec, nautilus --new-window #文件管理器
bind = $mod, G, exec,  ~/sh/hyprtogglewindow.sh wechat  wechat #微信
bind = $mod shift, G, exec, hdrop netease-cloud-music #网易云
#bind = ALT, D, exec, curl "127.0.0.1:60828/selection_translate" #划词翻译
bind = ALT, D, exec, wl-paste --primary | curl -s -X POST http://127.0.0.1:60828/  --data-binary @-
bind = ALT, S, exec, grim -g "$(slurp)" ~/.cache/com.pot-app.desktop/pot_screenshot_cut.png && curl "127.0.0.1:60828/ocr_translate?screenshot=false" #截图翻译
bind = $mod, M, exec,  dms ipc call keybinds toggle hyprland #快捷键
bind = $mod, F8, exec, /home/yyl/sh/startscrcpy.sh #打开scrcpy
bind = $mod, F10, exec, /home/yyl/sh/unlockphone.sh #解锁手机
bind = $mod, F9, exec, /home/yyl/sh/killscrcpy.sh #关闭scrcpy
bind = $mod, F1, exec, adb -s ed546061 shell input keyevent KEYCODE_HOME #手机返回
bind = $mod  ALT, F, exec, grim -t png -g "$(slurp)" - | swappy -f - # 截图 swappy
# bind = $mod shift, F, exec, grim -g "$(slurp)" -t ppm - | satty --filename - --fullscreen --copy-command wl-copy --output-filename "/home/yyl/Pictures/Screenshots/screenshot-%Y-%m-%d_%H:%M:%S.png" #截图 satty
bind = $mod ctrl, G, exec, hyprpicker |wl-copy #取色
bind = $mod ALT, M, exec, notify-send "Window Class" "$(hyprctl activewindow | grep 'class:')" && hyprctl activewindow | grep 'class:' | awk '{print $2}' | wl-copy #GET CLASS

# === Security ===
bind = $mod, X, exec, dms ipc call lock lock #锁屏
bind = $mod SHIFT, E, exit #推出桌面
bind = CTRL ALT, Delete, exec, dms ipc call processlist focusOrToggle

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# === Window Management ===
bind = $mod, W, killactive #关闭窗口
bind = $mod SHIFT, W, exec, hyprctl kill #杀死应用
bind = $mod, F, fullscreen, 1 #窗口铺满
bind = $mod SHIFT, F, fullscreen, 0  #窗口全屏
bind = $mod, T, movetoworkspacesilent, special:minimized #最小化
bind = $mod SHIFT, T, togglespecialworkspace, minimized #反最小化
bind = $mod SHIFT, T, movetoworkspace, +0 #反最小化
bind = $mod, S, togglefloating, # 切换悬浮模式
bind = $mod, Y, togglegroup, # 切换编组
bind = $mod, Z, changegroupactive # 切换编组中的窗口
bind = $mod, U, changegroupactive # 切换编组中的窗口
bind = $mod SHIFT, U, moveoutofgroup # 切换编组中的窗口
bind = $mod ALT, G, lockgroups,toggle #编组锁定
bind = $mod, D, layoutmsg, swapwithmaster master# 将当前窗口置为主窗口


# === Focus Navigation ===,
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# === Window Movement ===
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# === Column Navigation ===
bind = $mod, Home, focuswindow, first
bind = $mod, End, focuswindow, last

# === Monitor Navigation ===
# bind = $mod CTRL, left, focusmonitor, l
# bind = $mod CTRL, right, focusmonitor, r
# bind = $mod CTRL, H, focusmonitor, l
# bind = $mod CTRL, J, focusmonitor, d
# bind = $mod CTRL, K, focusmonitor, u
# bind = $mod CTRL, L, focusmonitor, r

# === Move to Monitor ===
# bind = $mod SHIFT CTRL, left, movewindow, mon:l
# bind = $mod SHIFT CTRL, down, movewindow, mon:d
# bind = $mod SHIFT CTRL, up, movewindow, mon:u,
# bind = $mod SHIFT CTRL, right, movewindow, mon:r
# bind = $mod SHIFT CTRL, H, movewindow, mon:l
# bind = $mod SHIFT CTRL, J, movewindow, mon:d
# bind = $mod SHIFT CTRL, K, movewindow, mon:u
# bind = $mod SHIFT CTRL, L, movewindow, mon:r

# === Workspace Navigation ===
bind = SUPER, Tab, workspace, previous #返回上一个空间
# bind = $mod, Page_Down, workspace, e+1
# bind = $mod, Page_Up, workspace, e-1
# bind = $mod, U, workspace, e+1
# bind = $mod, I, workspace, e-1
# bind = $mod CTRL, down, movetoworkspace, e+1
# bind = $mod CTRL, up, movetoworkspace, e-1
# bind = $mod CTRL, U, movetoworkspace, e+1
# bind = $mod CTRL, I, movetoworkspace, e-1


# === Move Workspaces ===
bind = $mod SHIFT, Page_Down, movetoworkspace, e+1
bind = $mod SHIFT, Page_Up, movetoworkspace, e-1
bind = $mod SHIFT, U, movetoworkspace, e+1
bind = $mod SHIFT, I, movetoworkspace, e-1

# === Mouse Wheel Navigation ===
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod CTRL, mouse_down, movetoworkspace, e+1
bind = $mod CTRL, mouse_up, movetoworkspace, e-1

# === Numbered Workspaces ===
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# === Move to Numbered Workspaces ===
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# === Column Management ===
bind = $mod, bracketleft, layoutmsg, preselect l
bind = $mod, bracketright, layoutmsg, preselect r

# === Sizing & Layout ===
; bind = $mod, R, layoutmsg, togglesplit
bind = $mod SHIFT, R, togglesplit, # dwindle
bind = $mod, R, swapsplit,
bind = $mod CTRL, F, resizeactive, exact 100%

# === Move/resize windows with mod + LMB/RMB and dragging ===
bindmd = $mod, mouse:272, Move window, movewindow
bindmd = $mod, mouse:273, Resize window, resizewindow

# === Move/resize windows with mod + LMB/RMB and dragging ===
bindd = $mod, code:20, Expand window left, resizeactive, -100 0
bindd = $mod, code:21, Shrink window left, resizeactive, 100 0

# === Manual Sizing ===
binde = $mod, minus, resizeactive, -10% 0
binde = $mod, equal, resizeactive, 10% 0
binde = $mod SHIFT, minus, resizeactive, 0 -10%
binde = $mod SHIFT, equal, resizeactive, 0 10%

# === Screenshots ===
bind = , Print, exec, dms screenshot
bind = CTRL, Print, exec, dms screenshot full
bind = ALT, Print, exec, dms screenshot window

# === System Controls ===
bind = $mod SHIFT,p, exit
# bind = $mod SHIFT, P, dpms, toggle

# ===
xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = false
}


env =  QT_IM_MODULE fcitx
env = XMODIFIERS "@im=fcitx"
env = MYPHONE,ed546061
env = LANG,zh_CN.UTF-8
env = LANGUAGE,zh_CN:zh:en_US:en
env = LC_ALL,zh_CN.UTF-8

# env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
# env = QT_SCALE_FACTOR, 1.6
# env = GDK_DPI_SCALE, 1.6

plugin:dynamic-cursors {

    # enables the plugin
    enabled = true
    mode = tilt
}
plugin:easymotion{
	textsize=25
	rounding=6
	textpadding=16
	bgcolor=rgba(33ccffee)
}

plugin:hyprexpo {
       columns = 3
       gap_size = 5
       bg_col = rgb(111111)
       workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1

       gesture_distance = 300 # how far is the "max" for the gesture
}

layerrule = blur, dms:bar
layerrule = ignorealpha 0.1, dms:bar
layerrule = animation fade, dms:bar

layerrule = blur, dms:dash$
layerrule = ignorealpha 0.2, dms:dash$

### Control Center
layerrule = blur, dms:control-center$
layerrule = ignorealpha 0.18, dms:control-center$
layerrule = noanim, dms:control-center$

### App Launcher
layerrule = blur, dms:app-launcher$
layerrule = ignorealpha 0.15, dms:app-launcher$
layerrule = noanim, dms:app-launcher$

### Notification Center Popout
layerrule = blur, dms:notification-center-popout$
layerrule = ignorealpha 0.22, dms:notification-center-popout$

layerrule = blur, dms:notification-popup$
layerrule = ignorealpha 0.45, dms:notification-popup$
layerrule = noanim, dms:notification-popup$

### OSD（音量 / 亮度）
layerrule = ignorealpha 0.0, dms:osd$
layerrule = noanim, dms:osd$

# DMS plugin popup
layerrule = blur, dms-plugin:plugin$
layerrule = ignorealpha 0.18, dms-plugin:plugin$
layerrule = noanim, dms-plugin:plugin$

# 解决微信弹窗显示问题
windowrule = noblur, class:(wechat), title:negative:^(朋友圈|微信|设置|聊天文件|预览|图片和视频)\W*
windowrule = noborder, class:(wechat), title:negative:^(朋友圈|微信|设置|聊天文件|预览|图片和视频)\W*
windowrule = noshadow, class:(wechat), title:negative:^(朋友圈|微信|设置|聊天文件|预览|图片和视频)\W*
windowrule = noblur, class:^wechat$, title:^微信发送给$
windowrule = noborder, class:^wechat$, title:^微信发送给$
windowrule = noshadow, class:^wechat$, title:^微信发送给$


