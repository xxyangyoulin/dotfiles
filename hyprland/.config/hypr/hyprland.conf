# ============================================================
# 10. 快捷键绑定 (KEYBINDINGS) - 严格对齐版
# ============================================================
$mod = SUPER

# === Application Launchers ===e
bind = $mod, O,             exec, hyprctl clients  >~/.layers
bind = $mod, return,        exec, kitty # 终端
bind = $mod SHIFT, S,       exec, dms ipc call settings toggle  #  设置
bind = $mod SHIFT, N,       exec, dms ipc call notepad toggle # 便签
bind = $mod, space,         exec, dms ipc call spotlight toggle # 搜索
bind = $mod, V,             exec, dms ipc call clipboard toggle # 剪切板
bind = $mod SHIFT, M,       exec, dms ipc call processlist focusOrToggle # 系统监视器
# bind = $mod, comma,       exec, dms ipc call settings focusOrTogglew 
bind = $mod, N,             exec, dms ipc call notifications toggle # 通知
# bind = $mod, Y,           exec, dms ipc call dankdash wallpaper
# bind = $mod, TAB,         exec, dms ipc call hypr toggleOverview
bind = $mod, E,             exec, nautilus --new-window #文件管理器
bind = $mod SHIFT, G,       exec, hyptg netease-cloud-music #网易云
#bind = ALT, D,             exec, curl "127.0.0.1:60828/selection_translate" #划词翻译
bind = ALT, D,              exec, wl-paste --primary | curl -s -X POST http://127.0.0.1:60828/  --data-binary @-
bind = ALT, S,              exec, grim -g "$(slurp)" ~/.cache/com.pot-app.desktop/pot_screenshot_cut.png && curl "127.0.0.1:60828/ocr_translate?screenshot=false" #截图翻译
bind = $mod, M,             exec,  dms ipc call keybinds toggle hyprland #快捷键
bind = $mod, F8,            exec, /home/yyl/sh/startscrcpy.sh #打开scrcpy
bind = $mod, F10,           exec, /home/yyl/sh/unlockphone.sh #解锁手机
bind = $mod, F9,            exec, /home/yyl/sh/killscrcpy.sh #关闭scrcpy
bind = $mod, F1,            exec, adb -s ed546061 shell input keyevent KEYCODE_HOME #手机返回
bind = $mod ALT, F,         exec, grim -t png -g "$(slurp)" - | swappy -f - # 截图 swappy
# bind = $mod shift, F,     exec, grim -g "$(slurp)" -t ppm - | satty --filename - --fullscreen --copy-command wl-copy --output-filename "/home/yyl/Pictures/Screenshots/screenshot-%Y-%m-%d_%H:%M:%S.png" #截图 satty
bind = $mod CTRL, G,        exec, hyprpicker |wl-copy #取色
bind = $mod ALT, M,         exec, notify-send "Window Class" "$(hyprctl activewindow | grep 'class:')" && hyprctl activewindow | grep 'class:' | awk '{print $2}' | wl-copy #GET CLASS
bind = $mod CTRL, M,        exec, notify-send "Window Title" "$(hyprctl activewindow)" && hyprctl activewindow | wl-copy #GET CLASS

# === Security ===
bind = $mod, X,             exec, dms ipc call lock lock; /home/yyl/sh/killscrcpy.sh #锁屏
bind = $mod SHIFT, E,       exit #推出桌面
bind = CTRL ALT, Delete,    exec, dms ipc call processlist focusOrToggle

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl  = , XF86AudioMute,        exec, dms ipc call audio mute
bindl  = , XF86AudioMicMute,     exec, dms ipc call audio micmute
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPause,       exec, playerctl play-pause
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioPrev,        exec, playerctl previous
bind = $mod, F11,                exec, /home/yyl/sh/dd-incbr.sh
bind = $mod, F12,                exec, /home/yyl/sh/dd-decbr.sh

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp,   exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# === Window Management ===
bind = $mod, W,             killactive #关闭窗口
bind = $mod SHIFT, W,       exec, hyprctl kill #杀死应用
bind = $mod, F,             fullscreen, 1 #窗口铺满
bind = $mod SHIFT, F,       fullscreen, 0  #窗口全屏
bind = $mod, T,             movetoworkspacesilent, special:minimized #最小化
bind = $mod SHIFT, T,       togglespecialworkspace, minimized #反最小化
bind = $mod SHIFT, T,       movetoworkspace, +0 #反最小化
bind = $mod, S,             togglefloating, # 切换悬浮模式
bind = $mod, Y,             togglegroup, # 切换编组
bind = $mod, Z,             changegroupactive # 切换编组中的窗口
bind = $mod, U,             changegroupactive # 切换编组中的窗口
bind = $mod SHIFT, U,       moveoutofgroup # 切换编组中的窗口
bind = $mod ALT, G,         lockgroups,toggle #编组锁定
bind = $mod, D,             layoutmsg, swapwithmaster master# 将当前窗口置为主窗口
bind = ALT, Tab,            cyclenext # Alt + Tab：切换到下一个窗口
bind = ALT SHIFT, Tab,      cyclenext, prev # Alt + Shift + Tab：切换到上一个窗口
bind = $mod SHIFT, C, 	    centerwindow


# === Focus Navigation ===
bind = $mod, H,             movefocus, l
bind = $mod, J,             movefocus, d
bind = $mod, K,             movefocus, u
bind = $mod, L,             movefocus, r

# === Window Movement ===
bind = $mod SHIFT, H,       movewindow, l
bind = $mod SHIFT, J,       movewindow, d
bind = $mod SHIFT, K,       movewindow, u
bind = $mod SHIFT, L,       movewindow, r

# === Column Navigation ===
bind = $mod, Home,          focuswindow, first
bind = $mod, End,           focuswindow, last

# === Monitor Navigation ===
# bind = $mod CTRL, left,   focusmonitor, l
# bind = $mod CTRL, right,  focusmonitor, r
# bind = $mod CTRL, H,      focusmonitor, l
# bind = $mod CTRL, J,      focusmonitor, d
# bind = $mod CTRL, K,      focusmonitor, u
# bind = $mod CTRL, L,      focusmonitor, r

# === Move to Monitor ===
# bind = $mod SHIFT CTRL, left,  movewindow, mon:l
# bind = $mod SHIFT CTRL, down,  movewindow, mon:d
# bind = $mod SHIFT CTRL, up,    movewindow, mon:u,
# bind = $mod SHIFT CTRL, right, movewindow, mon:r
# bind = $mod SHIFT CTRL, H,     movewindow, mon:l
# bind = $mod SHIFT CTRL, J,     movewindow, mon:d
# bind = $mod SHIFT CTRL, K,     movewindow, mon:u
# bind = $mod SHIFT CTRL, L,     movewindow, mon:r

# === Workspace Navigation ===
bind = SUPER, Tab,          workspace, previous #返回上一个空间
# bind = $mod, Page_Down,    workspace, e+1
# bind = $mod, Page_Up,      workspace, e-1
# bind = $mod, U,            workspace, e+1
# bind = $mod, I,            workspace, e-1
# bind = $mod CTRL, down,    movetoworkspace, e+1
# bind = $mod CTRL, up,      movetoworkspace, e-1
# bind = $mod CTRL, U,       movetoworkspace, e+1
# bind = $mod CTRL, I,       movetoworkspace, e-1

# === Move Workspaces ===
bind = $mod SHIFT, Page_Down, movetoworkspace, e+1
bind = $mod SHIFT, Page_Up,   movetoworkspace, e-1
bind = $mod SHIFT, U,         movetoworkspace, e+1
bind = $mod SHIFT, I,         movetoworkspace, e-1

# === Mouse Wheel Navigation ===
bind = $mod, mouse_down,           workspace, e+1
bind = $mod, mouse_up,             workspace, e-1
bind = $mod CTRL, mouse_down,      movetoworkspace, e+1
bind = $mod CTRL, mouse_up,        movetoworkspace, e-1

# === Numbered Workspaces ===
bind = $mod, 1,             workspace, 1
bind = $mod, 2,             workspace, 2
bind = $mod, 3,             workspace, 3
bind = $mod, 4,             workspace, 4
bind = $mod, 5,             workspace, 5
bind = $mod, 6,             workspace, 6
bind = $mod, 7,             workspace, 7
bind = $mod, 8,             workspace, 8
bind = $mod, 9,             workspace, 9
bind = $mod, 0,             workspace, 10

# === Move to Numbered Workspaces ===
bind = $mod SHIFT, 1,       movetoworkspace, 1
bind = $mod SHIFT, 2,       movetoworkspace, 2
bind = $mod SHIFT, 3,       movetoworkspace, 3
bind = $mod SHIFT, 4,       movetoworkspace, 4
bind = $mod SHIFT, 5,       movetoworkspace, 5
bind = $mod SHIFT, 6,       movetoworkspace, 6
bind = $mod SHIFT, 7,       movetoworkspace, 7
bind = $mod SHIFT, 8,       movetoworkspace, 8
bind = $mod SHIFT, 9,       movetoworkspace, 9
bind = $mod SHIFT, 0,       movetoworkspace, 10

# === Column Management ===
bind = $mod, bracketleft,   layoutmsg, preselect l
bind = $mod, bracketright,  layoutmsg, preselect r

# === Sizing & Layout ===
; bind = $mod, R,           layoutmsg, togglesplit
bind = $mod SHIFT, R,       togglesplit, # dwindle
bind = $mod, R,             swapsplit,
bind = $mod CTRL, F,        resizeactive, exact 100%

# === Move/resize windows with mod + LMB/RMB and dragging ===
bindmd = $mod, mouse:272,   Move window, movewindow
bindmd = $mod, mouse:273,   Resize window, resizewindow

# === Additional Window Controls ===
bindd = $mod, code:20,      Expand window left, resizeactive, -100 0
bindd = $mod, code:21,      Shrink window left, resizeactive, 100 0

# === Manual Sizing ===
binde = $mod, minus,        resizeactive, -10% 0
binde = $mod, equal,        resizeactive, 10% 0
binde = $mod SHIFT, minus,  resizeactive, 0 -10%
binde = $mod SHIFT, equal,  resizeactive, 0 10%

# === Screenshots ===
bind = , Print,             exec, dms screenshot
bind = CTRL, Print,         exec, dms screenshot full
bind = ALT, Print,          exec, dms screenshot window

# === System Controls ===
bind = $mod SHIFT, p,       exit
# bind = $mod SHIFT, P,      dpms, toggle

# use whatever shortcut floats your boat
#bind = $mainMod, Space,    exec, vicinae toggle

