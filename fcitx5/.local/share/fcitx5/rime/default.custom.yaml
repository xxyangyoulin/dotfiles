patch:
  __include: wanxiang_suggestion:/
  schema_list:
    - schema: wanxiang
    - schema: rime_ice
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: clear
      Shift_L: commit_code
      Shift_R: commit_code
      Control_L: noop
      Control_R: noop
  __patch:
    key_binder/bindings/+:
      - { when: paging, accept: comma, send: Page_Up }
      - { when: has_menu, accept: period, send: Page_Down }
      - { when: has_menu, accept: "Control+y", toggle: emoji }
      - { when: composing, accept: "Control+y", toggle: emoji }
